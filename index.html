<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/simpleTabs/style.css">
    <title>Simple tabs</title>
</head>
<body>
    <div class="container">
        <nav>
            <button tabNumber="1">1st Tab</button>
            <button tabNumber="2">2nd Tab</button>
            <button tabNumber="3">3rd Tab</button>
            <button tabNumber="4">4th Tab</button>
        </nav>
        <div class="contents">
            <div class="content active" contentNumber="1">
                <p>Content 1</p>
            </div>
            <div class="content" contentNumber="2">
                <p>Content 2</p>
            </div>
            <div class="content" contentNumber="3">
                <p>Content 3</p>
            </div>
            <div class="content" contentNumber="4">
                <p>Content 4</p>
            </div>
        </div>
    </div>
    <script src="/simpleTabs/script.js"></script>
</body>
</html>
